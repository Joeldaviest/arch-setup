# Application bindings
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, M, Music TUI, exec, tui-launch cliamp
bindd = SUPER SHIFT, N, VSCodium, exec, desktop-editor
bindd = SUPER SHIFT, D, Docker, exec, tui-launch lazydocker
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, Y, YouTube, exec, webapp-launch "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, webapp-focus WhatsApp "https://web.whatsapp.com/"

bindd = SUPER, T, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, T, Alacritty, exec, uwsm-app -- xdg-terminal-exec --dir="$(terminal-cwd)"
bindd = SUPER, G, Chromium, exec, desktop-browser
bindd = SUPER, Q, Close window, killactive,
bindd = SUPER, P, Launch apps, exec, desktop-launcher
bindd = SUPER, H, Focus left, movefocus, l
bindd = SUPER, J, Focus down, movefocus, d
bindd = SUPER, L, Focus right, movefocus, r
bindd = SUPER, K, Focus up, movefocus, u
bindd = SUPER SHIFT, H, Move window left, swapwindow, l
bindd = SUPER SHIFT, J, Move window down, swapwindow, d
bindd = SUPER SHIFT, K, Move window up, swapwindow, u
bindd = SUPER SHIFT, L, Move window right, swapwindow, r
bindd = SUPER SHIFT, S, Screenshot, exec, desktop-screenshot
bindd = SUPER SHIFT, SPACE, Toggle window floating/tiling, togglefloating,
bindd = SUPER SHIFT, C, Reload Hyprland, exec, hyprctl reload
bindd = SUPER SHIFT, E, System menu, exec, desktop-power menu
bindd = SUPER, ESCAPE, Lock system, exec, desktop-power lock

# Standalone desktop utilities
bindd = SUPER ALT, S, Screen recording, exec, desktop-screenrecord
bindd = SUPER, W, Select wallpaper, exec, wallpaper-select
bindd = SUPER ALT, R, Show reminders, exec, reminder show
bindd = SUPER SHIFT, R, Set reminder, exec, reminder-set
bindd = SUPER SHIFT CTRL, R, Clear reminders, exec, reminder clear
bindd = SUPER SHIFT, A, Audio controls, exec, desktop-audio
bindd = SUPER SHIFT, B, Bluetooth controls, exec, desktop-bluetooth
bindd = SUPER SHIFT, W, Wi-Fi controls, exec, desktop-wifi
bindld = , XF86PowerOff, Power menu, exec, desktop-power menu

# Relocated Omarchy functions that conflict with the i3 mappings
bindd = SUPER, E, Toggle tabs/tiling, togglegroup
bindd = SUPER ALT, K, Show key bindings, exec, keybindings

# Function row media controls from the previous i3 configuration
bindeld = , F1, Mute, exec, desktop-osd --output-volume mute-toggle
bindeld = , F2, Volume down, exec, desktop-osd --output-volume lower
bindeld = , F3, Volume up, exec, desktop-osd --output-volume raise
bindeld = , F4, Mute microphone, exec, audio-input-mute
bindeld = , F5, Brightness down, exec, display-brightness 5%-
bindeld = , F6, Brightness up, exec, display-brightness +5%

# i3-style resize submap
bindd = SUPER, R, Resize mode, submap, resize
submap = resize
binded = , LEFT, Shrink width, resizeactive, -10 0
binded = , DOWN, Grow height, resizeactive, 0 10
binded = , UP, Shrink height, resizeactive, 0 -10
binded = , RIGHT, Grow width, resizeactive, 10 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = SUPER, R, submap, reset
submap = reset

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Add other local bindings in ~/.config/hypr/local/input.conf or autostart.conf.

