# Portable Hyprland configuration
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/media.conf
source = ~/.config/hypr/clipboard.conf
source = ~/.config/hypr/tiling.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/autostart.conf

# Per-machine, untracked overrides
source = ~/.config/hypr/local/monitors.conf
source = ~/.config/hypr/local/input.conf
source = ~/.config/hypr/local/environment.conf
source = ~/.config/hypr/local/autostart.conf

# Application workspace assignments
windowrule = workspace 1 silent, match:class ^Alacritty$
windowrule = workspace 2 silent, match:class ^(chromium|Chromium)$
windowrule = workspace 3 silent, match:class ^(codium|VSCodium|Godot)$
windowrule = workspace 4 silent, match:class ^steam$
windowrule = workspace 5 silent, match:class ^(Lutris|lutris)$
windowrule = workspace 6 silent, match:class ^(timenzo|Timenzo)$

