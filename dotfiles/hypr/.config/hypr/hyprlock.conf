$color = rgba(26,27,38,1.0)
$inner_color = rgba(26,27,38,0.88)
$outer_color = rgba(169,177,214,1.0)
$font_color = rgba(192,202,245,1.0)
$check_color = rgba(122,162,247,1.0)
$fail_color = rgba(247,118,142,1.0)
$capslock_color = rgba(224,175,104,1.0)

general {
  immediate_render = true
  fractional_scaling = 2
  hide_cursor = true
  ignore_empty_input = true
  fail_timeout = 1500
}

background {
  monitor =
  color = $color
  path = ~/.config/wallpapers/current
  blur_size = 5
  blur_passes = 3
  brightness = 0.45
  contrast = 1.05
  vibrancy = 0.15
  vibrancy_darkness = 0.2
}

animations {
  enabled = false
}

input-field {
  monitor =
  size = 420, 64
  position = 0, 0
  halign = center
  valign = center
  inner_color = $inner_color
  outer_color = $outer_color
  outline_thickness = 2
  font_family = JetBrainsMono Nerd Font
  font_color = $font_color
  placeholder_text = <i>Enter password</i>
  dots_size = 0.22
  dots_spacing = 0.32
  dots_center = true
  dots_rounding = -1
  check_color = $check_color
  check_text = <i>Checking...</i>
  fail_color = $fail_color
  fail_text = <i>$FAIL ($ATTEMPTS)</i>
  capslock_color = $capslock_color
  rounding = 0
  shadow_passes = 0
  fade_on_empty = false
}
